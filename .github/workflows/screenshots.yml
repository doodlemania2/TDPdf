name: Screenshots

# Captures real screenshots of a released TDPdf build for the Microsoft Store listing and
# tdpdf.com. The app is WPF, so this needs a Windows desktop. It runs on a GitHub-hosted Windows
# runner until the repository variable CAPTURE_RUNNER is set to `tdp-windows-capture`, the fleet's
# self-hosted Windows machine (an interactive desktop session, see tdpdf-site docs/windows-capture-runner.md).
#
# Safe for that machine because this repo is public:
#   - Only `workflow_dispatch` and `push` can start it. Never `pull_request` or `pull_request_target`,
#     so a fork's code can never reach the machine.
#   - The job runs only when the person who started it is the repository owner (github.actor).
#   - Keep "Require approval for all outside collaborators" on in the repository's Actions settings.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to capture
        default: v2.0.0.0
      runner:
        description: Runner label to try for this run only (for example tdp-windows-capture). Empty uses the CAPTURE_RUNNER variable, else the hosted runner.
        required: false
        default: ''
  push:
    branches: ['screenshots/**']

permissions:
  contents: read

jobs:
  capture:
    # Defense in depth for the self-hosted machine: only the owner's own dispatches and pushes run.
    if: github.actor == github.repository_owner
    runs-on: ${{ inputs.runner || vars.CAPTURE_RUNNER || 'windows-2022' }}
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || 'v2.0.0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The hosted image has Set-DisplayResolution; the self-hosted machine does not and is already
      # 1920x1080 at 100%. Either way, fail within seconds, naming the cause, if the desktop is wrong
      # (not signed in, locked, or another resolution), instead of capturing blank or odd pictures.
      - name: Screen resolution
        shell: pwsh
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force
          }
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "Primary screen: $($b.Width)x$($b.Height)"
          if ($b.Width -ne 1920 -or $b.Height -ne 1080) {
            throw "The primary screen is $($b.Width)x$($b.Height), not 1920x1080. Is the capture user signed in at the console, and is the display set to 1920x1080 at 100%?"
          }
          if (-not [Environment]::UserInteractive) { throw 'This is not an interactive session. The runner must run as the signed-in capture user, not as a service.' }

      - name: Download release exe
        shell: pwsh
        run: |
          $u = "https://tdpdfreleases.blob.core.windows.net/releases/$env:TAG/TDPdf-$env:TAG-win-x64.exe"
          Invoke-WebRequest $u -OutFile "$env:RUNNER_TEMP\TDPdf.exe"
          (Get-AuthenticodeSignature "$env:RUNNER_TEMP\TDPdf.exe").SignerCertificate.Subject

      - name: Capture
        shell: pwsh
        run: |
          ./build/screenshots/capture.ps1 -Exe "$env:RUNNER_TEMP\TDPdf.exe" `
            -Demo "$PWD\build\screenshots\demo" -Out "$env:RUNNER_TEMP\shots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
