name: CodeQL

# CodeQL analysis for TDPdf.
#
# Required by the doodlemania2/TDPdf main-branch ruleset (must report
# results before merge). net10.0-windows cross-targeting from Linux requires
# EnableWindowsTargeting=true.
#
# Runs on `tdpdf-pr`, never `tdpdf`. This workflow triggers on pull_request, so it executes
# code from forks. `tdpdf-pr` is an ephemeral ARC scale set built for exactly that: no sudo
# (no_new_privs, all caps dropped), no docker, no Kubernetes token, no secrets, and a
# NetworkPolicy that allows DNS and the public internet only (no cluster, LAN or tailnet).
# `tdpdf` has sudo and the internal network, so it only takes triggers outside contributors
# cannot reach (tag pushes, workflow_dispatch, push to main). Never give this workflow a
# secret: the kernel is shared, so the pool is isolation, not a hard sandbox.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: tdpdf-pr
    # Dependabot PRs stay as notices and never start CI; the `run-ci` label opts one in.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ARC runner image ships the .NET 9 SDK, which cannot target net10.0 at all
      # (NETSDK1045 at restore). Pinning the SDK here rather than waiting on a runner image
      # rebuild keeps the workflow self-sufficient: it works on the self-hosted runner, on a
      # GitHub-hosted one, and on whatever the image happens to carry next month.
      #
      # DOTNET_INSTALL_DIR is required on the self-hosted runner specifically: setup-dotnet
      # installs to /usr/share/dotnet by default, the ARC container runs unprivileged, and the
      # install fails with "cp: cannot create directory ... Permission denied" — while still
      # reporting success, so the next step fails confusingly on the OLD SDK instead. Installing
      # into RUNNER_TEMP sidesteps it and is harmless on a hosted runner.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore TDPdf.csproj -p:EnableWindowsTargeting=true

      - name: Build (Release, x64)
        run: dotnet build TDPdf.csproj -c Release -p:Platform=x64 -p:EnableWindowsTargeting=true --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"
