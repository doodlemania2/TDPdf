name: release

# Publishes a self-contained single-file Windows x64 build of TDPdf whenever a
# tag matching v* is pushed: embeds the telemetry key, signs the EXE, attaches
# it to a GitHub Release, and updates the existing Intune Win32 app.
#
# The runner is LINUX (self-hosted ARC, label `tdpdf`), which is why signing
# uses osslsigncode rather than signtool.exe, and why the Intune step talks to
# Microsoft Graph directly instead of building a .intunewin with the
# Windows-only IntuneWinAppUtil.exe. A .intunewin is only a transport container
# for the portal UI; Graph takes the encrypted payload plus fileEncryptionInfo.
#
# Every optional stage is gated on its secrets being present, so the workflow
# degrades to exactly its previous behaviour (build + release, unsigned) rather
# than failing, if a secret is missing or rotated out.

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
      skip_intune:
        description: "Build and release, but do not touch Intune"
        type: boolean
        default: false
      skip_store:
        description: "Build and release, but do not update the Microsoft Store listing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: tdpdf
    # The `secrets` context is NOT available in step-level `if:`, so presence is
    # resolved once here into plain env flags (job-level `env` may read secrets)
    # and the steps gate on those.
    env:
      HAS_PFX:       ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
      HAS_INTUNE:    ${{ secrets.INTUNE_APP_ID != '' }}
      HAS_STORE:     ${{ secrets.MSSTORE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # The version Intune displays comes from the csproj, not the tag, so a
      # mistyped tag can never silently ship a mislabelled app version.
      - name: Read project version
        id: ver
        run: |
          V=$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' TDPdf.csproj)
          [ -n "$V" ] || { echo "::error::Could not read <AssemblyVersion> from TDPdf.csproj"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Project version: $V"

      # Guards the release-notes omission that has historically been the only
      # reason tagged builds fail — caught here with a clear message rather
      # than 10 minutes later inside `gh release create`.
      - name: Check release notes exist
        run: |
          NOTES=".github/release-notes/${{ steps.tag.outputs.name }}.md"
          [ -f "$NOTES" ] || { echo "::error::Missing $NOTES — release.yml passes it to --notes-file. Commit it and re-tag."; exit 1; }
          echo "Found $NOTES"

      # The ARC runner image ships the .NET 9 SDK, which cannot target net10.0 at all
      # (NETSDK1045 at restore). Pinning the SDK here rather than waiting on a runner image
      # rebuild keeps the workflow self-sufficient: it works on the self-hosted runner, on a
      # GitHub-hosted one, and on whatever the image happens to carry next month.
      #
      # DOTNET_INSTALL_DIR is required on the self-hosted runner specifically: setup-dotnet
      # installs to /usr/share/dotnet by default, the ARC container runs unprivileged, and the
      # install fails with "cp: cannot create directory ... Permission denied" — while still
      # reporting success, so the next step fails confusingly on the OLD SDK instead. Installing
      # into RUNNER_TEMP sidesteps it and is harmless on a hosted runner.
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.x'

      - name: Publish (Release, win-x64, single-file, self-contained)
        run: |
          dotnet publish TDPdf.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:EnableWindowsTargeting=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish

      - name: Sign
        id: sign
        if: env.HAS_PFX == 'true'
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          umask 077
          PFX="$(mktemp)"
          # tr -d strips any newlines/spaces the secret picked up on the way in:
          # PowerShell's pipeline appends a newline, and a pasted value can carry
          # wrapping. Base64 itself contains no whitespace, so this is lossless.
          printf '%s' "$PFX_B64" | tr -d '[:space:]' | base64 -d > "$PFX"
          [ -s "$PFX" ] || { echo "::error::CODESIGN_PFX_BASE64 did not decode to anything. Re-run the base64 step and set the secret again."; exit 1; }
          # Verify the password up front: osslsigncode's failure for a bad password
          # is cryptic, and this says plainly which of the two secrets is wrong.
          if ! openssl pkcs12 -in "$PFX" -passin pass:"$PFX_PASS" -nokeys -clcerts -noout 2>/tmp/pfxerr; then
            echo "::error::Could not open the PFX with CODESIGN_PFX_PASSWORD. Either the password is wrong or the file is not a valid PKCS#12."
            sed -e 's/^/  /' /tmp/pfxerr | head -5
            exit 1
          fi
          echo "PFX opened OK; subject: $(openssl pkcs12 -in "$PFX" -passin pass:"$PFX_PASS" -nokeys -clcerts 2>/dev/null | openssl x509 -noout -subject -enddate 2>/dev/null | tr '\n' ' ')"
          # Timestamping matters: without it the signature dies with the cert.
          # Try several authorities, as release.ps1 does.
          SIGNED=0
          for TS in http://timestamp.digicert.com http://timestamp.sectigo.com http://ts.ssl.com; do
            echo "Timestamp authority: $TS"
            if osslsigncode sign \
                 -pkcs12 "$PFX" -pass "$PFX_PASS" \
                 -h sha256 -ts "$TS" \
                 -n "TDPdf" -i "https://thedoodleproject.com/tdpdf" \
                 -in publish/TDPdf.exe -out publish/TDPdf.signed.exe; then
              SIGNED=1; break
            fi
            echo "Failed with $TS, trying next."
          done
          shred -u "$PFX" 2>/dev/null || rm -f "$PFX"
          [ "$SIGNED" = "1" ] || { echo "::error::Signing failed with every timestamp authority."; exit 1; }
          mv publish/TDPdf.signed.exe publish/TDPdf.exe
          osslsigncode verify -in publish/TDPdf.exe || \
            echo "::warning::Signature present but not chain-verifiable on this runner — expected for a self-signed cert whose root is trusted only on managed devices."
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Warn if unsigned
        if: env.HAS_PFX != 'true'
        run: echo "::warning::CODESIGN_PFX_BASE64 not set — shipping an UNSIGNED exe."

      - name: Stage release assets
        id: asset
        run: |
          set -euo pipefail
          mkdir -p dist
          cp publish/TDPdf.exe "dist/TDPdf-${{ steps.tag.outputs.name }}-win-x64.exe"
          # GPLv3 corresponding-source zip, produced by the BundleSource target.
          cp publish/*-src.zip dist/ 2>/dev/null || echo "::warning::No source zip found — check the BundleSource target."
          # Third-party notices. Also embedded in the exe (Help > Third-Party Licenses), but BSD-3
          # asks for reproduction "in the documentation or other materials provided with the
          # distribution", and a Release page is the only documentation a binary-only download has.
          cp THIRD-PARTY-NOTICES.md dist/ || { echo "::error::THIRD-PARTY-NOTICES.md missing — regenerate with build/generate-third-party-notices.ps1"; exit 1; }
          ( cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          ls -la dist

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "TDPdf $TAG" \
              --notes-file .github/release-notes/$TAG.md \
              --target "${GITHUB_SHA}"
          fi
          gh release upload "$TAG" dist/* --clobber

      # Points the Microsoft Store listing at the release asset just published.
      #
      # TDPdf is listed as an "EXE or MSI app", not MSIX — the Store holds a URL to our own
      # installer rather than a package. That choice is what lets the single-file exe, the
      # self-installer, this Linux runner and the Intune channel all stay exactly as they are;
      # MSIX would have forked every one of them. The trade is that the Store does NOT re-sign
      # our binary, so the exe must already carry a publicly-trusted signature.
      #
      # There is therefore no upload here. The whole submission is "here is a new immutable
      # URL", which GitHub release assets already are.
      #
      # Gated on its secret like every other optional stage, so a missing or rotated credential
      # degrades to build-and-release rather than failing the run. Skipped entirely for an
      # unsigned build: submitting one would be rejected at certification, and burning a
      # submission on a guaranteed rejection is worse than not submitting.
      - name: Update Microsoft Store listing
        if: env.HAS_STORE == 'true' && steps.sign.outputs.signed == 'true' && github.event.inputs.skip_store != 'true'
        env:
          TAG: ${{ steps.tag.outputs.name }}
          PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          set -euo pipefail
          # The CLI is a .NET tool and cross-platform, which is why this can live on the Linux
          # runner alongside everything else.
          dotnet tool install --global MSStore.CLI >/dev/null 2>&1 || dotnet tool update --global MSStore.CLI >/dev/null 2>&1
          export PATH="$PATH:$HOME/.dotnet/tools"

          msstore reconfigure \
            --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" \
            --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" \
            --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}" \
            --sellerId "${{ secrets.MSSTORE_SELLER_ID }}"

          ASSET="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/TDPdf-${TAG}-win-x64.exe"
          echo "Installer URL: $ASSET"
          # Fail here rather than at certification if the asset is not actually reachable:
          # the Store downloads and re-scans this URL, and a 404 wastes a submission.
          curl -sfIL --max-time 60 "$ASSET" >/dev/null || {
            echo "::error::Release asset not reachable at $ASSET"; exit 1; }

          # Read the current submission, swap only the installer URL, and send it back. Editing
          # the live shape rather than posting a hand-written one means listing copy, screenshots
          # and the GPLv3 licence terms are carried forward untouched.
          msstore submission get "$PRODUCT_ID" > submission.json
          python3 - "$ASSET" <<'PY'
          import json, sys
          url = sys.argv[1]
          d = json.load(open('submission.json'))
          pkgs = d.get('packages') or []
          if not pkgs:
              print("::error::No packages array in the current submission — check MSSTORE_PRODUCT_ID.")
              raise SystemExit(1)
          for p in pkgs:
              p['packageUrl'] = url
          json.dump(d, open('submission.json', 'w'), indent=2)
          print(f"Repointed {len(pkgs)} package entr{'y' if len(pkgs)==1 else 'ies'} at {url}")
          PY

          msstore submission update "$PRODUCT_ID" "$(cat submission.json)"
          msstore submission publish "$PRODUCT_ID"
          echo "Submitted. Certification is typically up to three business days."

      - name: Note why the Store step was skipped
        if: env.HAS_STORE == 'true' && steps.sign.outputs.signed != 'true'
        run: echo "::warning::Store submission skipped — the exe is unsigned, and the Store requires a publicly-trusted signature for EXE/MSI listings."

      # Updates the EXISTING app: adds a content version and repoints
      # committedContentVersion. Assignments live on the app, not on the content
      # version, so the current targeting is untouched.
      - name: Update Intune app
        if: env.HAS_INTUNE == 'true' && github.event.inputs.skip_intune != 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          pwsh -NoProfile -File build/intune/Deploy-IntuneUpdate.ps1 \
            -AppId "${{ secrets.INTUNE_APP_ID }}" \
            -ExePath publish/TDPdf.exe \
            -DetectionScriptPath build/intune/Detect-TDPdf.ps1 \
            -DisplayVersion "${{ steps.ver.outputs.version }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### TDPdf ${{ steps.tag.outputs.name }}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Version (from csproj) | ${{ steps.ver.outputs.version }} |"
            echo "| Signed | ${{ steps.sign.outputs.signed == 'true' && 'yes' || 'NO — unsigned' }} |"
            echo "| Intune | ${{ (env.HAS_INTUNE == 'true' && github.event.inputs.skip_intune != 'true') && 'updated' || 'skipped' }} |"
            echo "| Store | ${{ (env.HAS_STORE == 'true' && steps.sign.outputs.signed == 'true' && github.event.inputs.skip_store != 'true') && 'submitted' || 'skipped' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
