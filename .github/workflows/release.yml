name: release

# Publishes a self-contained single-file Windows x64 build of TDPdf whenever a
# tag matching v* is pushed: signs the EXE (Azure Artifact Signing), attaches it
# to a GitHub Release, updates the Microsoft Store listing, and tells the private
# doodlemania2/tdpdf-fleet repo to deploy it to Intune.
#
# The runner is LINUX (self-hosted ARC, label `tdpdf`), which is why it signs
# with Jsign rather than signtool.exe. It only runs on tag pushes and
# workflow_dispatch, never on pull_request, so outside code never reaches it.
#
# Every optional stage is gated on its secrets being present, so the workflow
# degrades to exactly its previous behaviour (build + release, unsigned) rather
# than failing, if a secret is missing or rotated out.

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
      skip_intune:
        description: "Build and release, but do not tell tdpdf-fleet to deploy to Intune"
        type: boolean
        default: false
      skip_store:
        description: "Build and release, but do not update the Microsoft Store listing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: tdpdf
    # The `secrets` context is NOT available in step-level `if:`, so presence is
    # resolved once here into plain env flags (job-level `env` may read secrets)
    # and the steps gate on those.
    env:
      HAS_AZSIGN:    ${{ secrets.SIGN_CLIENT_SECRET != '' }}
      HAS_FLEET:     ${{ secrets.FLEET_DISPATCH_TOKEN != '' }}
      HAS_SITE:      ${{ secrets.SITE_DISPATCH_TOKEN != '' }}
      # vars.MSSTORE_ENABLED stays unset until the first, hand-made Store submission is
      # published: while that one is in certification, the API must not touch the product.
      HAS_STORE:     ${{ secrets.MSSTORE_CLIENT_ID != '' && secrets.MSSTORE_PRODUCT_ID != '' && vars.MSSTORE_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # The release version comes from the csproj, not the tag. tdpdf-fleet then refuses to
      # deploy a binary whose file version does not match the tag.
      - name: Read project version
        id: ver
        run: |
          V=$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' TDPdf.csproj)
          [ -n "$V" ] || { echo "::error::Could not read <AssemblyVersion> from TDPdf.csproj"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Project version: $V"

      # Guards the release-notes omission that has historically been the only
      # reason tagged builds fail — caught here with a clear message rather
      # than 10 minutes later inside `gh release create`.
      - name: Check release notes exist
        run: |
          NOTES=".github/release-notes/${{ steps.tag.outputs.name }}.md"
          [ -f "$NOTES" ] || { echo "::error::Missing $NOTES — release.yml passes it to --notes-file. Commit it and re-tag."; exit 1; }
          echo "Found $NOTES"

      # The ARC runner image ships the .NET 9 SDK, which cannot target net10.0 at all
      # (NETSDK1045 at restore). Pinning the SDK here rather than waiting on a runner image
      # rebuild keeps the workflow self-sufficient: it works on the self-hosted runner, on a
      # GitHub-hosted one, and on whatever the image happens to carry next month.
      #
      # DOTNET_INSTALL_DIR is required on the self-hosted runner specifically: setup-dotnet
      # installs to /usr/share/dotnet by default, the ARC container runs unprivileged, and the
      # install fails with "cp: cannot create directory ... Permission denied" — while still
      # reporting success, so the next step fails confusingly on the OLD SDK instead. Installing
      # into RUNNER_TEMP sidesteps it and is harmless on a hosted runner.
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.x'

      - name: Publish (Release, win-x64, single-file, self-contained)
        run: |
          dotnet publish TDPdf.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:EnableWindowsTargeting=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish

      # Azure Artifact Signing (formerly Trusted Signing). Microsoft's documented path is
      # signtool.exe plus a Windows-only dlib, which would have forced this job back onto a
      # Windows runner and undone the reason it is on the K3s cluster at all. Jsign reaches the
      # same REST endpoint from any JVM: the file's digest goes to Azure, Microsoft's HSMs sign
      # it, and only the signature comes back. No private key exists on the runner, in a secret,
      # or anywhere we could leak one.
      #
      # This is the signature the Microsoft Store requires — it chains to a CA in the Microsoft
      # Trusted Root Program. The Store step and the fleet dispatch are both gated on
      # `steps.sign`, so an unsigned build reaches neither.
      - name: Sign (Azure Artifact Signing)
        id: sign
        if: env.HAS_AZSIGN == 'true'
        env:
          # Not secrets. RBAC on the certificate profile is what protects signing, not the
          # names. The endpoint is region-specific (eus = East US, where the account lives);
          # Artifact Signing resources cannot be migrated across region, subscription or tenant,
          # so this value is as permanent as the account itself.
          AZSIGN_ENDPOINT: https://eus.codesigning.azure.net
          AZSIGN_ALIAS: tdp/TDPCertProfile
          # Fed from the SIGN_* secrets rather than a shared AZURE_* trio, so the
          # signing identity and the fleet-management identity rotate independently. Jsign 7.5
          # does NOT read these itself for TRUSTEDSIGNING: it refuses with "storepass option must
          # specify the Azure API access token". So the step trades them for a token below and
          # hands Jsign `--storepass env:AZSIGN_TOKEN`, which keeps both the secret and the token
          # off the command line and out of `ps`.
          AZURE_TENANT_ID: ${{ secrets.SIGN_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.SIGN_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.SIGN_CLIENT_SECRET }}
          JSIGN_VERSION: '7.5'
          JSIGN_SHA256: 602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
        run: |
          set -euo pipefail
          : "${AZURE_TENANT_ID:?SIGN_TENANT_ID is not set — Jsign cannot acquire a token without it}"
          : "${AZURE_CLIENT_ID:?SIGN_CLIENT_ID is not set — Jsign cannot acquire a token without it}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jre-headless
          curl -fsSL -o /tmp/jsign.jar \
            "https://github.com/ebourg/jsign/releases/download/${JSIGN_VERSION}/jsign-${JSIGN_VERSION}.jar"
          # Pinned by digest. This jar is handed our signing credential, so "whatever the latest
          # release happens to be" is not an acceptable supply chain for it.
          echo "${JSIGN_SHA256}  /tmp/jsign.jar" | sha256sum -c - || {
            echo "::error::jsign-${JSIGN_VERSION}.jar does not match its pinned SHA-256. Refusing to run it."
            exit 1
          }
          : "${AZURE_CLIENT_SECRET:?SIGN_CLIENT_SECRET is not set}"
          # pwsh is preinstalled on the runner; jq is not guaranteed. The token lives ~1 hour,
          # far longer than one signature takes.
          AZSIGN_TOKEN="$(pwsh -NoProfile -Command '(Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:AZURE_TENANT_ID/oauth2/v2.0/token" -Body @{ client_id = $env:AZURE_CLIENT_ID; client_secret = $env:AZURE_CLIENT_SECRET; scope = "https://codesigning.azure.net/.default"; grant_type = "client_credentials" }).access_token')"
          : "${AZSIGN_TOKEN:?could not get an Artifact Signing token for SIGN_CLIENT_ID}"
          echo "::add-mask::$AZSIGN_TOKEN"
          export AZSIGN_TOKEN
          # No --tsaurl: Jsign's TRUSTEDSIGNING keystore timestamps against Microsoft's own TSA
          # by default (verified 2026-10-15: the signature carries the 1.3.6.1.4.1.311.3.3.1
          # RFC 3161 counter-signature), and it must — the certificates the service issues live
          # three days, so an untimestamped signature would expire before most people had
          # downloaded the release.
          java -jar /tmp/jsign.jar \
            --storetype TRUSTEDSIGNING \
            --keystore "$AZSIGN_ENDPOINT" \
            --alias "$AZSIGN_ALIAS" \
            --storepass env:AZSIGN_TOKEN \
            --alg SHA-256 \
            --name "TDPdf" \
            --url "https://thedoodleproject.com/tdpdf" \
            publish/TDPdf.exe
          sudo apt-get install -y -qq osslsigncode
          # Informational only. Ubuntu's CA bundle does not carry the Microsoft code-signing
          # roots, so a chain failure here says nothing about how Windows will see the file.
          osslsigncode verify -in publish/TDPdf.exe || \
            echo "::warning::Signature present; chain not verifiable on a Linux CA bundle, which does not carry the Microsoft Trusted Root Program roots. Verify on Windows."
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Warn if unsigned
        if: env.HAS_AZSIGN != 'true'
        run: echo "::warning::SIGN_CLIENT_SECRET is not set — shipping an UNSIGNED exe."

      - name: Stage release assets
        id: asset
        run: |
          set -euo pipefail
          mkdir -p dist
          cp publish/TDPdf.exe "dist/TDPdf-${{ steps.tag.outputs.name }}-win-x64.exe"
          # GPLv3 corresponding-source zip, produced by the BundleSource target.
          cp publish/*-src.zip dist/ 2>/dev/null || echo "::warning::No source zip found — check the BundleSource target."
          # Third-party notices. Also embedded in the exe (Help > Third-Party Licenses), but BSD-3
          # asks for reproduction "in the documentation or other materials provided with the
          # distribution", and a Release page is the only documentation a binary-only download has.
          cp THIRD-PARTY-NOTICES.md dist/ || { echo "::error::THIRD-PARTY-NOTICES.md missing — regenerate with build/generate-third-party-notices.ps1"; exit 1; }
          ( cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          ls -la dist

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "TDPdf $TAG" \
              --notes-file .github/release-notes/$TAG.md \
              --target "${GITHUB_SHA}"
          fi
          gh release upload "$TAG" dist/* --clobber

      # Points the Microsoft Store listing at the release asset just published.
      #
      # TDPdf is listed as an "EXE or MSI app", not MSIX — the Store holds a URL to our own
      # installer rather than a package. That choice is what lets the single-file exe, the
      # self-installer, this Linux runner and the Intune channel all stay exactly as they are;
      # MSIX would have forked every one of them. The trade is that the Store does NOT re-sign
      # our binary, so the exe must already carry a publicly-trusted signature.
      #
      # The whole submission is "here is a new installer URL". It cannot be the GitHub release
      # asset: Partner Center refuses any URL that redirects ("Provide a download URL without
      # redirection"), and GitHub assets always 302 to a short-lived signed URL. So the signed
      # exe is first copied to a public-read blob, which answers 200 directly:
      #   https://tdpdfreleases.blob.core.windows.net/releases/<tag>/TDPdf-<tag>-win-x64.exe
      # Storage account `tdpdfreleases` (RG `personal`, The Doodle Project tenant) has shared-key
      # access disabled; the SIGN_* identity holds Storage Blob Data Contributor on the
      # `releases` container only, so no storage key exists anywhere.
      #
      # Gated on its secret like every other optional stage, so a missing or rotated credential
      # degrades to build-and-release rather than failing the run. Skipped entirely for an
      # unsigned build: submitting one would be rejected at certification, and burning a
      # submission on a guaranteed rejection is worse than not submitting.
      - name: Copy the installer to a direct-download URL for the Store
        id: storeurl
        if: env.HAS_STORE == 'true' && steps.sign.outputs.signed == 'true' && github.event.inputs.skip_store != 'true'
        env:
          TAG: ${{ steps.tag.outputs.name }}
          AZURE_TENANT_ID: ${{ secrets.SIGN_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.SIGN_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.SIGN_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          FILE="dist/TDPdf-${TAG}-win-x64.exe"
          URL="https://tdpdfreleases.blob.core.windows.net/releases/${TAG}/TDPdf-${TAG}-win-x64.exe"
          TOKEN="$(pwsh -NoProfile -Command '(Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:AZURE_TENANT_ID/oauth2/v2.0/token" -Body @{ client_id = $env:AZURE_CLIENT_ID; client_secret = $env:AZURE_CLIENT_SECRET; scope = "https://storage.azure.com/.default"; grant_type = "client_credentials" }).access_token')"
          : "${TOKEN:?could not get a storage token for SIGN_CLIENT_ID}"
          echo "::add-mask::$TOKEN"
          # One Put Blob (allowed up to 5000 MiB on this API version). A workflow_dispatch re-run
          # overwrites the blob, matching how it replaces the GitHub release assets.
          curl -sSf --max-time 600 -X PUT "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-ms-version: 2023-11-03" \
            -H "x-ms-blob-type: BlockBlob" \
            -H "x-ms-blob-content-type: application/vnd.microsoft.portable-executable" \
            --upload-file "$FILE" >/dev/null
          # Prove it is what the Store will see: 200 with no redirect, and the same bytes.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -I "$URL")"
          [ "$code" = "200" ] || { echo "::error::$URL answered $code, not 200"; exit 1; }
          want="$(sha256sum "$FILE" | cut -d' ' -f1)"
          got="$(curl -sSf --max-time 600 "$URL" | sha256sum | cut -d' ' -f1)"
          [ "$want" = "$got" ] || { echo "::error::blob bytes differ from the signed exe"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Update Microsoft Store listing
        id: store
        if: env.HAS_STORE == 'true' && steps.sign.outputs.signed == 'true' && github.event.inputs.skip_store != 'true'
        # The Store must never cost the fleet its update: this step runs before the fleet dispatch, and the
        # Store API answers 404 "No Product Found" for an EXE app until its first, hand-made
        # submission has been published (Microsoft's documented prerequisite). A failure here
        # is reported in the summary and the run goes on to the fleet dispatch.
        continue-on-error: true
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        # Repoints the existing package's installer URL, commits, waits for readiness, submits.
        # Calls the Store submission API directly; see the script for why not the msstore CLI.
        run: python3 build/store/publish-store.py "${{ steps.storeurl.outputs.url }}"

      - name: Note why the Store step was skipped
        if: env.HAS_STORE == 'true' && steps.sign.outputs.signed != 'true'
        run: echo "::warning::Store submission skipped — this build is not signed by Azure Artifact Signing, and the Store requires a publicly-trusted signature for EXE/MSI listings."

      # Intune deployment lives in the private repo doodlemania2/tdpdf-fleet (#178). This
      # tells it a signed release is out; it downloads the exe from the release, verifies hash,
      # signature and version, and updates the Intune app. Optional: without
      # FLEET_DISPATCH_TOKEN the fleet's 15-minute check picks the release up anyway. The token
      # (not set; nothing needs it) would be a fine-grained one with Contents: write on tdpdf-fleet only. Secrets are not passed
      # to workflows from forks, and this workflow only runs on tags and workflow_dispatch.
      - name: Tell tdpdf-fleet to deploy
        id: fleet
        if: env.HAS_FLEET == 'true' && github.event.inputs.skip_intune != 'true' && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLEET_DISPATCH_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh api repos/doodlemania2/tdpdf-fleet/dispatches \
            -f event_type=tdpdf-released -f "client_payload[tag]=$TAG"
          echo "Dispatched tdpdf-released for $TAG. Follow it at https://github.com/doodlemania2/tdpdf-fleet/actions"

      # Same pattern for the private doodlemania2/tdpdf-site repo, so tdpdf.com's download page
      # moves to this release at once. Optional: without SITE_DISPATCH_TOKEN (fine-grained,
      # Contents: write on tdpdf-site only) that repo's own 15-minute check rebuilds the site anyway.
      - name: Tell tdpdf-site to rebuild
        if: env.HAS_SITE == 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh api repos/doodlemania2/tdpdf-site/dispatches \
            -f event_type=tdpdf-release -f "client_payload[tag]=$TAG"

      - name: Note why Intune was not dispatched
        if: env.HAS_FLEET == 'true' && github.event.inputs.skip_intune != 'true' && steps.fleet.outcome == 'skipped'
        run: echo "::warning::tdpdf-fleet was not told to deploy — this build is not signed by Azure Artifact Signing, and the fleet only deploys binaries whose signature validates against public roots."

      - name: Summary
        if: always()
        run: |
          {
            echo "### TDPdf ${{ steps.tag.outputs.name }}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Version (from csproj) | ${{ steps.ver.outputs.version }} |"
            echo "| Signed | ${{ steps.sign.outputs.signed == 'true' && 'yes — Azure Artifact Signing (publicly trusted)' || 'NO — unsigned' }} |"
            echo "| Intune | ${{ steps.fleet.outcome == 'success' && 'dispatched to tdpdf-fleet' || 'not dispatched' }} |"
            echo "| Store | ${{ steps.store.outcome == 'success' && 'submitted' || (steps.store.outcome == 'failure' && 'FAILED — see the Store step log; the release and Intune were not affected' || 'skipped') }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Notify ntfy on failure
    runs-on: tdpdf
    timeout-minutes: 5
    needs: [release]
    if: failure()
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/ntfy-notify
        with:
          ntfy-url: ${{ secrets.NTFY_URL }}
          title: TDPdf release FAILED
