name: Publish a release to the Microsoft Store

# Sends an EXISTING GitHub Release to the Store, without rebuilding: the signed exe already on
# the release (the same bytes Intune and the download page have) is checked against the
# release's SHA256SUMS.txt, copied to the direct-download URL Partner Center needs (it rejects
# installer URLs that redirect, and GitHub asset URLs always do), and the Store listing is
# repointed at it and submitted for certification.
#
# release.yml does the same for a new tag when vars.MSSTORE_ENABLED is 'true'. Use this one
# for a release that went out while the Store step was off, or to resubmit.
#
# workflow_dispatch only, on a GitHub-hosted runner: outside contributors cannot trigger it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v2.0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: msstore
  cancel-in-progress: false

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify the release exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a release tag: $TAG"; exit 1; }
          NAME="TDPdf-${TAG}-win-x64.exe"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "$NAME" --pattern SHA256SUMS.txt
          (cd dist && grep "  ${NAME}\$" SHA256SUMS.txt | sha256sum -c -)
          echo "FILE=dist/$NAME" >> "$GITHUB_ENV"

      - name: Copy the installer to a direct-download URL
        id: storeurl
        env:
          AZURE_TENANT_ID: ${{ secrets.SIGN_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.SIGN_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.SIGN_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          URL="https://tdpdfreleases.blob.core.windows.net/releases/${TAG}/TDPdf-${TAG}-win-x64.exe"
          TOKEN="$(curl -sSf -X POST "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" \
            --data-urlencode "client_id=$AZURE_CLIENT_ID" --data-urlencode "client_secret=$AZURE_CLIENT_SECRET" \
            --data-urlencode "scope=https://storage.azure.com/.default" --data-urlencode "grant_type=client_credentials" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          echo "::add-mask::$TOKEN"
          curl -sSf --max-time 600 -X PUT "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-ms-version: 2023-11-03" \
            -H "x-ms-blob-type: BlockBlob" \
            -H "x-ms-blob-content-type: application/vnd.microsoft.portable-executable" \
            --upload-file "$FILE" >/dev/null
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -I "$URL")"
          [ "$code" = "200" ] || { echo "::error::$URL answered $code, not 200"; exit 1; }
          want="$(sha256sum "$FILE" | cut -d' ' -f1)"
          got="$(curl -sSf --max-time 600 "$URL" | sha256sum | cut -d' ' -f1)"
          [ "$want" = "$got" ] || { echo "::error::blob bytes differ from the release exe"; exit 1; }
          echo "Direct-download URL ok: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Repoint the Store listing and submit
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: python3 build/store/publish-store.py "${{ steps.storeurl.outputs.url }}"
