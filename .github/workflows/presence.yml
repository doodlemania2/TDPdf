# The shared workflow lives in the public fleet-presence-dispatch repo: a public repo like this
# one cannot call a reusable workflow from a private repo.
# Tells tdpdf.com to rebuild on every push to main (fleet presence standard, requirement 7).
# The site works out which features changed from presence/features.json. A feature that turns
# "ready" also gets a social post drafted in TDPPublic.
#
# Push to main only, never pull_request: this job runs on the self-hosted tdpdf runner and holds
# FLEET_DISPATCH_TOKEN. The release-time tdpdf-release dispatch in release.yml stays as it is.
name: presence

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: presence
  cancel-in-progress: false

jobs:
  presence:
    uses: doodlemania2/fleet-presence-dispatch/.github/workflows/presence-dispatch.yml@70da9eaa082fd9d5f99ea0a7c89df5025528f961  # main 2026-11-27
    with:
      property: tdpdf
      targets: '["doodlemania2/tdpdf-site"]'
      runner: tdpdf
    secrets:
      dispatch_token: ${{ secrets.FLEET_DISPATCH_TOKEN }}
