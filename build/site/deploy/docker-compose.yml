# tdpdf.com on doodlessd.
#
# Lives at /home/derek/tdpdf-site-stack/docker-compose.yml, beside docs-stack (whose pattern
# this follows), chores-stack and documenso-stack. One container:
#
#   tdpdf-site         the static pages in nginx, from ghcr.io/doodlemania2/tdpdf-site:latest.
#                      .github/workflows/site.yml builds and pushes that tag; watchtower (it
#                      lives in docs-stack and watches every container carrying its label)
#                      pulls it within 5 minutes. No deploy credential exists anywhere.
#
# Published on loopback only (127.0.0.1:18106). Public traffic arrives through the shared
# host-network `public-fleet` tunnel (K3s repo, services/edge/public-fleet/config.yml), which
# replaced this site's own tunnel on 2026-10-30. Nothing is reachable from the LAN. Do not add
# an NPM proxy host for it.

name: tdpdf-site

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  tdpdf-site:
    image: ghcr.io/doodlemania2/tdpdf-site:latest
    container_name: tdpdf-site
    restart: unless-stopped
    ports: ["127.0.0.1:18106:8080"]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 64m, cpus: "0.25" }
    logging: *logging
