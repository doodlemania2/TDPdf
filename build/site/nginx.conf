# tdpdf.com: static pages written by build-site.ps1. Reached only through the Cloudflare
# tunnel (deploy/docker-compose.yml), which passes the visitor's Host header through.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects are relative, so nginx never names its own port 8080 in a Location header.
  absolute_redirect off;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  # No scripts at all. Inline styles stay allowed: the page content uses style attributes.
  add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  # One canonical host. Ghost answered www with a 301 to the apex; keep that.
  if ($host = www.tdpdf.com) { return 301 https://tdpdf.com$request_uri; }

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # URLs the Ghost site had that this one does not: the home page also lived at /home/,
  # and an empty post index at /news/ (with its RSS feed).
  location = /home/ { return 301 /; }
  location ^~ /news/ { return 301 /; }
  location ^~ /rss/ { return 301 /; }

  # Assets are linked with ?v=<hash>, so a changed file is a new URL.
  location /assets/ { add_header Cache-Control "public, max-age=604800" always; add_header X-Content-Type-Options nosniff always; }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  }

  error_page 404 /404.html;
}
