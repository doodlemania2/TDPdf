# tdpdf.com: static pages written by build-site.ps1. Reached only through the shared Cloudflare
# tunnel `public-fleet` on loopback (deploy/docker-compose.yml), which passes the visitor's Host
# header through.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects are relative, so nginx never names its own port 8080 in a Location header.
  absolute_redirect off;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  # Scripts: only the Zoho SalesIQ chat widget (layout.html). The sha256 is the widget's inline
  # bootstrap <script>; change that script and the hash must change with it, in both CSP lines below.
  # Inline styles stay allowed: the page content uses style attributes, and so does the widget.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-i0fcLzdq0vluPE2moPUnhqKbjtNpbZn4xSOh1qdD0ls=' https://*.zohopublic.com https://*.zohocdn.com https://salesiq.zoho.com; style-src 'self' 'unsafe-inline' https://*.zohocdn.com https://*.zohopublic.com; img-src 'self' data: blob: https://*.zohocdn.com https://*.zohopublic.com https://*.zoho.com https://*.zohostatic.com; font-src 'self' data: https://*.zohocdn.com https://*.zohopublic.com; connect-src https://*.zohopublic.com wss://*.zohopublic.com https://*.zohocdn.com https://*.zoho.com wss://*.zoho.com; media-src blob: https://*.zohocdn.com https://*.zohopublic.com; frame-src https://*.zohopublic.com https://*.zoho.com; base-uri 'none'; form-action 'self' https://*.zohopublic.com; frame-ancestors 'none'" always;

  # One canonical host. Ghost answered www with a 301 to the apex; keep that.
  if ($host = www.tdpdf.com) { return 301 https://tdpdf.com$request_uri; }

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # URLs the Ghost site had that this one does not: the home page also lived at /home/,
  # and an empty post index at /news/ (with its RSS feed).
  location = /home/ { return 301 /; }
  location ^~ /news/ { return 301 /; }
  location ^~ /rss/ { return 301 /; }

  # Assets are linked with ?v=<hash>, so a changed file is a new URL.
  location /assets/ { add_header Cache-Control "public, max-age=604800" always; add_header X-Content-Type-Options nosniff always; }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-i0fcLzdq0vluPE2moPUnhqKbjtNpbZn4xSOh1qdD0ls=' https://*.zohopublic.com https://*.zohocdn.com https://salesiq.zoho.com; style-src 'self' 'unsafe-inline' https://*.zohocdn.com https://*.zohopublic.com; img-src 'self' data: blob: https://*.zohocdn.com https://*.zohopublic.com https://*.zoho.com https://*.zohostatic.com; font-src 'self' data: https://*.zohocdn.com https://*.zohopublic.com; connect-src https://*.zohopublic.com wss://*.zohopublic.com https://*.zohocdn.com https://*.zoho.com wss://*.zoho.com; media-src blob: https://*.zohocdn.com https://*.zohopublic.com; frame-src https://*.zohopublic.com https://*.zoho.com; base-uri 'none'; form-action 'self' https://*.zohopublic.com; frame-ancestors 'none'" always;
  }

  error_page 404 /404.html;
}
